<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Muscu">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <title>Muscu</title>
</head>
<body>
  <main id="app"><p class="chargement">Chargement…</p></main>

  <div id="repos" class="repos" hidden>
    <div class="repos-barre"><div class="repos-progression" data-repos-progression></div></div>
    <div class="repos-contenu">
      <div class="repos-texte">
        <span class="repos-titre" data-repos-titre>Repos</span>
        <span class="repos-temps" data-repos-temps>0:00</span>
      </div>
      <div class="repos-boutons">
        <button type="button" data-action="repos-moins" aria-label="Retirer 15 secondes">−15</button>
        <button type="button" data-action="repos-plus" aria-label="Ajouter 15 secondes">+15</button>
        <button type="button" data-action="repos-passer" class="principal">Passer</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="visionneuse" class="visionneuse" data-action="fermer-photo" hidden>
    <img alt="Photo de la machine">
    <span class="visionneuse-fermer">Toucher pour fermer</span>
  </div>

  <nav class="nav" aria-label="Navigation principale">
    <a href="#/" data-nav="accueil">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11" /></svg>
      <span>Aujourd'hui</span>
    </a>
    <a href="#/repas" data-nav="repas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 1.5-3 4-3 7h3v11" /></svg>
      <span>Repas</span>
    </a>
    <a href="#/historique" data-nav="historique">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l3.5-4 3 2.5L19 8" /></svg>
      <span>Historique</span>
    </a>
    <a href="#/reglages" data-nav="reglages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" /><circle cx="16" cy="7" r="2" /><circle cx="8" cy="17" r="2" /></svg>
      <span>Réglages</span>
    </a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
